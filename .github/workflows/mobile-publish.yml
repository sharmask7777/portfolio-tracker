name: Mobile Build and Publish

on:
  workflow_run:
    workflows: ["E2E Tests"]
    types:
      - completed
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-publish-apk:
    name: Build & Release Android APK
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js & pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prebuild Native Android Project
        working-directory: mobile
        run: npx expo prebuild --platform android --clean

      - name: Build Release APK via Gradle
        working-directory: mobile/android
        run: ./gradlew assembleRelease --no-daemon

      - name: Locate & Rename APK
        run: |
          mkdir -p dist-apk
          cp mobile/android/app/build/outputs/apk/release/app-release.apk dist-apk/portfolio-tracker-release.apk
          echo "APK generated: $(ls -lh dist-apk/portfolio-tracker-release.apk)"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-tracker-android-apk
          path: dist-apk/portfolio-tracker-release.apk
          retention-days: 30

      - name: Publish to GitHub Releases (Automatic Tag)
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: mobile-v${{ github.run_number }}
          name: "Portfolio Tracker Mobile (v${{ github.run_number }})"
          body: |
            ### 📱 Portfolio Tracker Mobile Release
            
            Automated Android release generated after passing all validation gates:
            - Backend Hermetic Verification & Rust Parity
            - Web Frontend Build & Verification
            - Mobile Fowler Maintainability Sensors (`complexity <= 10`, `max-lines <= 50`, `zero-any`)
            - Mobile E2E Simulation (Pairing, Biometrics, Offline Valuation, CAS Outbox)
            
            **Installation:**
            Download `portfolio-tracker-release.apk` below and install directly on your Android phone.
          files: dist-apk/portfolio-tracker-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-ota-updates:
    name: Publish Silent Over-The-Air (OTA) Update
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    needs: build-and-publish-apk
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js & pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Publish OTA Update to Devices (if EXPO_TOKEN configured)
        working-directory: mobile
        if: env.EXPO_TOKEN != ''
        run: npx eas-cli update --auto --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
