name: E2E Tests
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
        cache: 'npm'
    
    - name: Install dependencies
      run: |
        npm ci --legacy-peer-deps
        cd frontend && npm ci --legacy-peer-deps

    - name: Run Hermetic Unit Tests (Frontend)
      run: |
        (cd frontend && npm run test:unit)

    - name: Setup Rust Toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        components: rustfmt, clippy

    - name: Rust Dependency Cache
      uses: Swatinem/rust-cache@v2
      with:
        workspaces: "backend-rs -> target"

    - name: Run Rust Workspace Quality & Tests
      run: |
        cd backend-rs
        cargo fmt --check
        cargo clippy --workspace --all-targets -- -D warnings
        cargo test --workspace

    - name: Run Dual-Runner Parity Validation Harness
      run: |
        cd backend-rs
        cargo run --package portfolio-parity

    - name: Install Playwright Browsers
      run: cd frontend && npx playwright install --with-deps chromium

    - name: Start Docker compose stack
      run: |
        cat <<EOF > .env
        DOCKER_REGISTRY_USER=shaleenks
        PORTFOLIO_DB_USER=postgres
        PORTFOLIO_DB_PASSWORD=password
        PORTFOLIO_DB_NAME=portfolio_tracker
        IP_GLOBAL=127.0.0.1
        TZ_GLOBAL=UTC
        VOLUME_PREFIX_GLOBAL=.
        VITE_API_PORT=3001
        VITE_API_URL=http://127.0.0.1:3001
        EOF

        export NODE_ENV=development
        npm run docker:up

        echo "Waiting for postgres to become healthy..."
        until docker exec portfolio_tracker_db pg_isready -U postgres -d portfolio_tracker; do
          sleep 2
        done

        echo "Waiting for frontend to become ready..."
        until curl -s http://127.0.0.1:8082 > /dev/null; do
          sleep 2
        done

    - name: Run Playwright E2E tests
      run: |
        if [ "${{ github.event_name }}" == "pull_request" ]; then
          echo "Running smoke, responsiveness, mock portfolio, and regression tests..."
          (cd frontend && npm run test:e2e:docker -- tests/smoke.spec.ts tests/responsiveness.spec.ts tests/mock-portfolios.spec.ts tests/dashboard-regression-verification.spec.ts)
        else
          echo "Running full E2E suite..."
          (cd frontend && npm run test:e2e:docker)
        fi

    - name: Tear down Docker stack
      if: always()
      run: npm run docker:down

    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: playwright-report
        path: frontend/playwright-report/
        retention-days: 30
