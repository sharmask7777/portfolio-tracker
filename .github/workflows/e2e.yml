name: E2E Tests
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: pnpm/action-setup@v4
      with:
        version: 12
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
        cache: 'pnpm'

    - name: Install dependencies
      run: pnpm install --frozen-lockfile

    - name: Run Python Sensors (Ruff & Anti-PII) & View-Layer Boundary Guardrails
      run: |
        pip install ruff
        ruff check scripts backend-rs/scripts
        python3 scripts/check-privacy-and-pii.py
        python3 scripts/check-view-layer-boundaries.py --self-test
        python3 scripts/check-view-layer-boundaries.py

    - name: Run @portfolio/core-view Sensors & Coverage
      run: |
        pnpm --filter @portfolio/core-view typecheck
        pnpm --filter @portfolio/core-view test:coverage

    - name: Run Hermetic Unit Tests & Build (Frontend)
      run: |
        pnpm --filter frontend build
        pnpm --filter frontend test:unit

    - name: Run Mobile Maintainability Sensors, Coverage & E2E Tests
      run: |
        pnpm --filter @portfolio/core-view build:verify
        pnpm --filter mobile build:verify
        pnpm --filter mobile test:e2e

    - name: Run Cross-Platform Parity Gates
      run: |
        pnpm parity:check
        pnpm parity:visual

    - name: Run Incremental Diff Coverage Guardrail
      run: |
        python3 scripts/check-diff-coverage.py --self-test
        python3 scripts/check-diff-coverage.py --min-diff-coverage 85

    - name: Setup Rust Toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        components: rustfmt, clippy

    - name: Rust Dependency Cache
      uses: Swatinem/rust-cache@v2
      with:
        workspaces: "backend-rs -> target"

    - name: Run Rust Workspace Quality, Tests & Coverage
      run: |
        cargo install --locked cargo-deny
        cargo install cargo-machete
        cargo install cargo-llvm-cov
        (cd backend-rs && ./scripts/verify.sh)
        pnpm run test:coverage:backend

    - name: Install Playwright Browsers
      run: pnpm --filter frontend exec playwright install --with-deps chromium

    - name: Start Docker compose stack
      run: |
        cat <<EOF > .env
        DOCKER_REGISTRY_USER=shaleenks
        PORTFOLIO_DB_USER=postgres
        PORTFOLIO_DB_PASSWORD=password
        PORTFOLIO_DB_NAME=portfolio_tracker
        IP_GLOBAL=127.0.0.1
        TZ_GLOBAL=UTC
        VOLUME_PREFIX_GLOBAL=.
        VITE_API_PORT=3001
        VITE_API_URL=http://127.0.0.1:3001
        EOF

        export NODE_ENV=development
        pnpm run docker:up

        echo "Waiting for postgres to become healthy..."
        until docker exec portfolio_tracker_db pg_isready -U postgres -d portfolio_tracker; do
          sleep 2
        done

        echo "Waiting for frontend to become ready..."
        until curl -s http://127.0.0.1:8082 > /dev/null; do
          sleep 2
        done

    - name: Run Playwright E2E tests
      run: |
        if [ "${{ github.event_name }}" == "pull_request" ]; then
          echo "Running smoke, responsiveness, mock portfolio, and regression tests..."
          pnpm --filter frontend test:e2e:docker -- tests/smoke.spec.ts tests/responsiveness.spec.ts tests/mock-portfolios.spec.ts tests/dashboard-regression-verification.spec.ts
        else
          echo "Running full E2E suite..."
          pnpm --filter frontend test:e2e:docker
        fi

    - name: Tear down Docker stack
      if: always()
      run: pnpm run docker:down

    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: playwright-report
        path: frontend/playwright-report/
        retention-days: 30
