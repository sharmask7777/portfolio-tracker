[graph]
targets = []
all-features = false
no-default-features = false

[output]
feature-depth = 1

[advisories]
yanked = "deny"
unmaintained = "all"
ignore = [
    { id = "RUSTSEC-2026-0382", reason = "transitive dependency in lockfile: rustls-webpki" },
    { id = "RUSTSEC-2026-0381", reason = "transitive dependency in lockfile: webpki-roots" },
]

[licenses]
unused-allowed-license = "allow"
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "ISC",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "OpenSSL",
    "Zlib",
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.8
exceptions = []

[licenses.private]
ignore = true
registries = []

[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"
allow = []
allow-workspace = false
deny = []
skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []

[[licenses.clarify]]
crate = "portfolio-api"
expression = "ISC"
license-files = []

[[licenses.clarify]]
crate = "portfolio-core"
expression = "ISC"
license-files = []

[[licenses.clarify]]
crate = "portfolio-db"
expression = "ISC"
license-files = []

[[licenses.clarify]]
crate = "portfolio-worker"
expression = "ISC"
license-files = []

[[licenses.clarify]]
crate = "portfolio-parity"
expression = "ISC"
license-files = []
