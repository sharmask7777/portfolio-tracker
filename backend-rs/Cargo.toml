[workspace]
resolver = "2"
members = [
    "crates/portfolio-core",
    "crates/portfolio-db",
    "crates/portfolio-api",
    "crates/portfolio-worker",
    "crates/portfolio-parity",
]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
rust_decimal = { version = "1.36", features = ["serde-with-str", "serde-with-float", "maths"] }
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1.43", features = ["full"] }
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres", "chrono", "rust_decimal", "uuid"] }
axum = { version = "0.8", features = ["macros"] }
tower-http = { version = "0.6", features = ["cors", "trace", "set-header"] }
redis = { version = "0.28", features = ["tokio-comp"] }
jsonwebtoken = "9.3"
bcrypt = "0.17"
uuid = { version = "1.13", features = ["v4", "serde"] }
proptest = "1.6"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tracing = "0.1"
ts-rs = { version = "10.1", features = ["chrono-impl", "uuid-impl", "no-serde-warnings"] }

[workspace.lints.rust]
missing_docs = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }
unreachable_pub = "warn"
unknown_lints = "allow"
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(tarpaulin_include)'] }

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"
bare_urls = "warn"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
panic = "deny"
todo = "deny"
redundant_clone = "deny"
undocumented_unsafe_blocks = "deny"

# Tightened static guardrail lints (previously allowed, now denied or warned)
uninlined_format_args = "allow" # LaTeX and long math formatting
doc_markdown = "allow" # KaTeX math syntax $f(x)$ / $w_A(c)$ conflicts with markdown backtick parser
inefficient_to_string = "deny"
redundant_else = "deny"
manual_string_new = "deny"
map_unwrap_or = "deny"
manual_let_else = "deny"
redundant_closure_for_method_calls = "deny"
unnested_or_patterns = "deny"
manual_midpoint = "deny"

# Pedantic allowances with clear rationale
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
must_use_candidate = "allow"
cast_possible_truncation = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
similar_names = "allow"
too_many_lines = "allow"
match_same_arms = "allow"
struct_excessive_bools = "allow"
needless_pass_by_value = "allow"
unreadable_literal = "allow"
return_self_not_must_use = "allow"
items_after_statements = "allow"
cast_lossless = "allow"
cast_possible_wrap = "allow"
ignored_unit_patterns = "allow"
implicit_hasher = "allow"
if_not_else = "allow"
format_push_string = "allow"
float_cmp = "allow"
default_trait_access = "allow"
wildcard_imports = "allow"
used_underscore_binding = "allow"

