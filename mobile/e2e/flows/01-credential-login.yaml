appId: com.portfolio.mobile
---
# Flow: Direct Credential Login on Android Emulator
- launchApp:
    clearState: true

# Assert initial authentication screen
- assertVisible: "Pair with Server"

# Switch to Password / Email Login tab
- tapOn:
    id: "tab-credentials"

# Verify login form is active
- assertVisible: "Email & Password Login"
- assertVisible: "Sign In"

# Submit login form directly using master synthetic account
- tapOn:
    id: "login-submit-button"

# Wait for Dashboard to render after successful login
- assertVisible: "Dashboard"
- assertVisible: "Total Net Worth"

# Capture evidence screenshot
- takeScreenshot: "01-login-success"
