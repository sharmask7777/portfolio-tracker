appId: com.portfolio.mobile
---
# Flow 05: Interactive Historical Valuation Chart & Checkpoints Verification
- launchApp:
    clearState: false

# Handle unlock prompt if present
- runFlow:
    when:
      visible: "Unlock Portfolio"
    commands:
      - tapOn: "Unlock Portfolio"

- assertVisible:
    id: "historical-trend-chart"

- scrollUntilVisible:
    element:
      id: "chart-svg-canvas"
    direction: DOWN

- tapOn:
    id: "range-button-1Y"

# Perform swipe/scrub across chart canvas
- swipe:
    direction: LEFT
    element:
      id: "chart-svg-canvas"
    duration: 600

# Assert pinned inspection card is visible
- assertVisible:
    id: "checkpoint-tooltip-card"

# Assert inspection card metrics
- assertVisible: "Valuation"
- assertVisible: "Invested"
- assertVisible: "Gain / ATH"

# Tap Reset to Latest
- tapOn:
    id: "reset-probe-button"

# Assert returns to today's state
- assertVisible:
    id: "ath-badge"
